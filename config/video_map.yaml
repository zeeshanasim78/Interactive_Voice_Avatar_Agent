# Video-topic keyword map (Section 5.4). Used by both the Intent Router's
# Step 2 (Section 5.3, src/routing/intent_router.py) for keyword/fuzzy and
# semantic video matching, and by the Video Library Manager
# (src/video/player.py, Phase 4) to resolve a matched topic to its file for
# playback. The topics/keywords below are the ones given verbatim in
# Section 5.4 of NAB_AI_System_Design.md; `file:` entries are placeholders
# until NAB supplies the actual video library (see design doc Section 2.3
# Assumptions) — swap them for real files with no code change (NFR6).

videos:
  - topic: "NAB Achievements"
    keywords: ["achievements", "success stories", "kamyabi", "kaamyabiyan", "کامیابیاں", "کامیابی کی کہانیاں"]
    file: "videos/nab_achievements.mp4"
  - topic: "NAB AI Investigation System"
    keywords: ["AI investigation", "artificial intelligence system", "AI system", "مصنوعی ذہانت کا نظام", "اے آئی تحقیقاتی نظام"]
    file: "videos/nab_ai_investigation.mp4"
  - topic: "About NAB"
    keywords: ["about nab", "what is nab", "nab kya hai", "نیب کیا ہے", "نیب کے بارے میں"]
    file: "videos/about_nab.mp4"
  - topic: "Working of NAB"
    keywords: ["how nab works", "working of nab", "nab ka nizam", "نیب کیسے کام کرتا ہے", "نیب کا نظام"]
    file: "videos/working_of_nab.mp4"
